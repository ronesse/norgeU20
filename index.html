.travel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}.travel-card{padding:12px;display:flex;flex-direction:column;min-height:0}.travel-card h3{margin:3px 0 8px;font-size:1rem}.flight-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.flight-row:first-of-type{border-top:0}.flight-row b{font-size:.94rem}.flight-row span{font-size:.72rem;color:var(--muted)}.flight-time{font-weight:900;font-size:.94rem;text-align:right}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{font-size:.68rem;background:#f5f8fc;border:1px solid var(--line);border-radius:999px;padding:4px 6px;font-weight:750}.hotel-strip{padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;flex:0 0 auto}.hotel-strip h3{margin:2px 0 1px;font-size:.94rem}.mini-actions{display:flex;gap:6px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-weight:850;font-size:.72rem;background:white}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}

.timeline{display:grid;grid-template-rows:repeat(7,1fr);gap:5px;flex:1;min-height:0}.day-row{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;padding:7px 9px}.day-date{font-weight:900;color:var(--navy);line-height:1.1}.day-date span{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}.day-main{min-width:0}.day-main b{display:block;font-size:.84rem;line-height:1.15}.day-main small{display:block;color:var(--muted);font-size:.68rem;line-height:1.18;margin-top:2px}.badge{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;font-weight:900;border-radius:999px;padding:4px 6px;white-space:nowrap}.b-train{background:#e8f0fb;color:#0b559b}.b-friendly{background:#e5f6ee;color:#116848}.b-tba{background:#fff0d7;color:#875100}.b-match{background:#eeeafa;color:#5f3d9d}.b-travel{background:#eef1f5;color:#566272}

.match-card{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}.match-headline{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto}.match-headline b{font-size:.82rem}.match-list{display:grid;grid-template-rows:repeat(7,1fr);flex:1;min-height:0}.match-row{display:grid;grid-template-columns:70px 48px 1fr 44px;gap:7px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}.match-row:first-child{border-top:0}.match-date{font-size:.68rem;color:var(--muted);font-weight:800}.match-time{font-size:.9rem;font-weight:950;color:var(--navy)}.match-teams{font-size:.79rem;line-height:1.1;font-weight:750}.court{font-size:.66rem;font-weight:900;color:var(--blue);text-align:right}

.place-grid{display:grid;grid-template-rows:repeat(3,1fr);gap:8px;flex:1;min-height:0}.place-card{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 11px;min-height:0}.place-icon{width:38px;height:38px;border-radius:12px;background:#e9f1fa;display:grid;place-items:center;font-size:1.15rem}.place-card h3{margin:2px 0;font-size:.93rem;line-height:1.1}.place-address{font-size:.72rem;color:var(--muted);line-height:1.25}.place-actions{display:flex;flex-direction:column;gap:5px}.place-note{font-size:.66rem;color:var(--muted);margin-top:3px;line-height:1.15}

.nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-top:1px solid rgba(221,229,239,.96);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 24px rgba(15,35,60,.08)}

/* 2026 mobile refresh */
:root{

body{background:radial-gradient(circle at 100% 0,#dbe9f7 0,transparent 30%),linear-gradient(180deg,#f7f9fc 0%,#edf3f9 100%)}

/* Fill each screen more confidently */
.travel-grid,.timeline,.place-grid,.transport-grid,.match-card{flex:1}
.travel-card,.place-card,.route-card,.ticket-card,.day-row{background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(248,251,255,.94))}

/* Program becomes a true mobile agenda */
.timeline{gap:8px;grid-template-rows:repeat(7,minmax(0,1fr))}
.day-row{position:relative;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;padding:11px 13px;border-radius:20px;overflow:hidden}
.day-row:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:4px;border-radius:0 8px 8px 0;background:#b9c9da}

.badge{font-size:.57rem;padding:5px 8px}

.travel-card{border-radius:22px;padding:16px}.travel-card h3{font-size:1.1rem}.flight-row{padding:11px 0}.flight-row b,.flight-time{font-size:1rem}.flight-row span{font-size:.72rem}.chip{padding:5px 8px;background:white}.hotel-strip{border-radius:20px;padding:13px 15px}

/* Tournament */
.match-card{border-radius:22px}.match-headline{padding:13px 15px;background:linear-gradient(90deg,#0a2b4d,#154d7f);color:#fff;border:0}.match-headline .muted{color:rgba(255,255,255,.72)}
.match-row{padding:10px 13px;grid-template-columns:78px 54px 1fr 48px}.match-row:nth-child(even){background:rgba(240,246,252,.58)}.match-time{font-size:1rem}.match-teams{font-size:.84rem}.court{font-size:.68rem}

.place-grid{gap:10px}.place-card{border-radius:22px;padding:14px 15px;grid-template-columns:48px 1fr auto}.place-icon{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#eef5fd,#ddebf8);font-size:1.3rem}.place-card h3{font-size:1rem}.place-address{font-size:.75rem}.place-note{font-size:.68rem}
